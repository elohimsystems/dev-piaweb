frater_soft_pia_web_homepage:
    pattern:  /hello/{name}
    defaults: { _controller: FraterSoftPiaWebBundle:Default:index }
    
frater_soft_pia_web_parametros:
    pattern:  /parametros
    defaults: { _controller: FraterSoftPiaWebBundle:Default:parametros }    
    
frater_soft_pia_web_enviar:
    pattern:  /enviar
    defaults: { _controller: FraterSoftPiaWebBundle:Default:eviaremail }
    
frater_soft_pia_web_jqueryui:
    path:  /jqueryui
    defaults:
        _controller: FrameworkBundle:Template:template
        template:    FraterSoftPiaWebBundle:Default:jqueryui.html.twig

frater_soft_pia_web_jqueryui_smoothness:
    path:  /jqueryui-smoothness
    defaults:
        _controller: FrameworkBundle:Template:template
        template:    FraterSoftPiaWebBundle:Default:jqueryui-smoothness.html.twig
        
frater_soft_pia_web_jquery_validator:
    path:  /jqvalidator
    defaults:
        _controller: FrameworkBundle:Template:template
        template:    FraterSoftPiaWebBundle:Default:jqvalidator.html.twig        

frater_soft_pia_web_jquery_ajax:
    path:  /jqueryajax
    defaults:
        _controller: FrameworkBundle:Template:template
        template:    FraterSoftPiaWebBundle:Default:ajax.html.twig  

frater_soft_pia_web_jqueryui_dialog:
    path:  /dialog
    defaults:
        _controller: FrameworkBundle:Template:template
        template:    FraterSoftPiaWebBundle:Default:dialog.html.twig    
        
frater_soft_pia_web_sessions:
    pattern:  /sessions
    defaults: { _controller: "FraterSoftPiaWebBundle:Default:sessions" }
        
        
