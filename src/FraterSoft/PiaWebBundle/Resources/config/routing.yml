  pattern: /sitemap.xml
  defaults: { _controller: FraterSoftPiaWebBundle:Default:sitemap }

frater_soft_pia_web_homepage:
  pattern: /hello/{name}
  defaults: { _controller: FraterSoftPiaWebBundle:Default:index }

frater_soft_pia_web_parametros:
