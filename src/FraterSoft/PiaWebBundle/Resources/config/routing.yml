frater_soft_pia_web_jquery_ajax:
  path: /jqueryajax
  defaults:
    _controller: FrameworkBundle:Template:template
    template: FraterSoftPiaWebBundle:Default:ajax.html.twig

frater_soft_pia_web_jqueryui_dialog:
  path: /dialog
  defaults:
    _controller: FrameworkBundle:Template:template
    template: FraterSoftPiaWebBundle:Default:dialog.html.twig

frater_soft_pia_web_sessions:
  pattern: /sessions
  defaults: { _controller: "FraterSoftPiaWebBundle:Default:sessions" }

fos_user_resetting_reset:
  pattern: /resetting/reset/{token}
  defaults: { _controller: FraterSoftPiaWebBundle:Resetting:reset }
  requirements:
    _method: GET|POST

