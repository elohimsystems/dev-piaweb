name: Deploy via FTP

on:
  push:
    branches:
      - develop
      - master

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Crear vendor.zip
        run: zip -r vendor.zip vendor/

      - name: Subir vendor.zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor.zip
          retention-days: 7

      - name: Deploy (vendor.zip incluido, vendor/ excluido)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /
          exclude: |
            .git/**
            .gitignore
            .github/**
            .travis.yml
            composer.json
            composer.lock
            README.md
            LICENSE
            UPGRADE*
            error_log
            phpinfo.php
            vendor/**

      - name: Limpiar
        run: rm -f vendor.zip
