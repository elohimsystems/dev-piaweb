security:
    encoders:
        FraterSoft\PiaWebBundle\Entity\User: sha512

    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_USER, ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    providers:
        fos_userbundle:
            id: fos_user.user_provider.username

    firewalls:
        dev:
            pattern:  ^/(_(profiler|wdt)|css|images|js)/
            security: false

        public:
            pattern:  ^/(competidor/(findform|consultar|asociadosajax|buscar|.+/validaemailpersonalajax)|inscrito/(new|create|categorias|buscarprecioajax|precioeventoajax|preciocompetenciaajax|cupocompetenciasajax|\d+/confirmacion|.+confirmaciongrupo)|pago/(new|newtdc|newgrupo|.+/formaspagoajax))
            security: false

        main:
            pattern: ^/
            form_login:
                provider: fos_userbundle
                login_path: fos_user_security_login
                check_path: fos_user_security_check
                default_target_path: /eventos
            logout:
                path: fos_user_security_logout
                target: /
            anonymous: true

    access_control:
        - { path: ^/login$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/register, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/resetting, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/contacto$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/evento/\d+/detalle, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/sitemap\.xml$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/, role: ROLE_USER }
